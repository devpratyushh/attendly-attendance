<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Isolated responsive portal checks</title><style>body{margin:0;background:#eef1f0;font:12px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center}iframe{display:block;border:0;width:1440px;height:1200px}select{padding:6px;border-radius:6px;border:1px solid #ddd}</style></head><body><header>Isolated responsive fixture<label>Viewport <select id="size"><option value="1440">Desktop · 1440</option><option value="1024">Tablet · 1024</option><option value="390">Mobile · 390</option></select></label><label>Portal <select id="role"><option value="teacher">Teacher</option><option value="student">Student</option></select></label></header><output id="metrics" style="display:block;padding:10px"></output><iframe title="Portal under test" id="preview" src="/tests/portal.html?role=teacher"></iframe><script type="module">const frame=document.querySelector('#preview');window.addEventListener('message',event=>{if(event.origin===location.origin && event.source===frame.contentWindow && event.data.type==='portal-fixture-layout')document.querySelector('#metrics').textContent=JSON.stringify(event.data);});document.querySelector('#size').onchange=e=>{frame.style.width=e.target.value+'px';};document.querySelector('#role').onchange=e=>{frame.src='/tests/portal.html?role='+e.target.value;};</script></body></html>
